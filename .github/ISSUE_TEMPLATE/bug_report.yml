name: Bug 报告
description: 崩溃、卡死、数值或界面异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请附上复现步骤；如果游戏异常退出，请附根目录的 `crash.log`。
  - type: input
    id: version
    attributes:
      label: 版本 / 运行环境
      description: 版本或 commit，以及系统、Python、pygame-ce 版本
      placeholder: v0.5.1-alpha / Windows 11 / Python 3.14 / pygame-ce 2.5.8
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动到出现问题的每一步
      placeholder: |
        1. 启动游戏
        2. 选择树/图身体
        3. 进入 R10
        4. 使用 CUT 划过 WARD 的边
        5. 出现……
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 发生了什么，和预期哪里不同
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望结果（可选）
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: 粘贴 `crash.log` 或报错，也可以直接拖入截图、录屏
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: false
        - label: 我没有在公开 Issue 中放入密钥或隐私信息
          required: false
