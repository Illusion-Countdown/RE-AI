name: 功能建议
description: 新玩法、新卡、新敌人或体验改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先写清“玩家体验”和“具体规则”，不要只写“加个玩法”。
        详细模板见 [`docs/FEATURE_REQUESTS.md`](https://github.com/Illusion-Countdown/RE-AI/blob/main/docs/FEATURE_REQUESTS.md)。
        多角色需求先看[协作规范](https://github.com/Illusion-Countdown/RE-AI/blob/main/docs/COLLABORATION.md)：父 Issue 不 @队友，通知下沉到子 Issue。
        优先级标签由维护者按[标签规则](https://github.com/Illusion-Countdown/RE-AI/blob/main/docs/LABELS.md)统一设置。
  - type: textarea
    id: idea
    attributes:
      label: 需求描述
      description: 当前玩法哪里不够？玩家在什么情况下，用什么，得到什么新体验？
      placeholder: 玩家可以把一个敌人回滚到 3 秒前的位置和 HP，用来打断 Boss 蓄力。
    validations:
      required: false
  - type: textarea
    id: rules
    attributes:
      label: 具体规则
      description: 触发条件、费用、目标、成功/失败、冷却，以及和 WEAK/LINK/GC 等机制的交互
      placeholder: |
        - 目标：单个敌人
        - 费用：2 工作内存
        - 次数：每房 2 次
        - 普通敌人：恢复 3 秒前 HP/位置
        - Boss：只恢复位置
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 影响范围（可选）
      description: 内容数据 / 战斗行为 / UI / 音效 / 接口
    validations:
      required: false
  - type: textarea
    id: event_contract
    attributes:
      label: 事件契约（多角色需求）
      description: 事件名 / 发送方 / 监听方 / payload / 注册人；没有事件写“无”。规则见 docs/EVENT_NAMING.md。
      placeholder: |
        事件名：ENEMY_SPLIT_ON_DEATH
        发送方：B
        监听方：C / D
        payload：source_id, x, y, child_count
        注册：memory_run/events.py
    validations:
      required: false
  - type: textarea
    id: subtasks
    attributes:
      label: 子任务（多角色需求）
      description: 列出子 Issue 编号和 Owner，不要写 @；单角色需求可留空
      placeholder: |
        - [ ] #12 [C] 粒子特效（Owner: C）
        - [ ] #13 [B] 分裂逻辑（Owner: B）
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（可选）
      description: 写成可检查的 Given/When/Then 或勾选清单
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue / Roadmap，没有重复
          required: false
        - label: 这个需求符合当前单人模式范围
          required: false
